name: Release

# Push a tag like v1.2.3 to build, sign, notarize and publish a DMG, plus the appcast.xml
# that in-app updates (Sparkle) read from the latest release.
# Without the signing secrets (see docs/RELEASING.md) the workflow still publishes, but the
# DMG is clearly labelled "-unsigned", has no appcast, and the release is a pre-release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0) — creates a draft release"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      # Signing is used only when every secret it needs is present.
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' && secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD != '' && secrets.DEVELOPER_ID_APPLICATION != '' && secrets.APPLE_TEAM_ID != '' && secrets.NOTARY_KEY_P8 != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' && secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
      # Any of them set means signing was intended: then all eight must be there. (A signed
      # release without an appcast would break in-app updates for everyone.)
      ANY_SIGNING: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' || secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD != '' || secrets.DEVELOPER_ID_APPLICATION != '' || secrets.APPLE_TEAM_ID != '' || secrets.NOTARY_KEY_P8 != '' || secrets.NOTARY_KEY_ID != '' || secrets.NOTARY_ISSUER_ID != '' || secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="$INPUT_VERSION"; fi
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$V' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          if [[ "$ANY_SIGNING" == "true" && "$HAS_SIGNING" != "true" ]]; then
            echo "::error::Some signing secrets are set but not all eight (see docs/RELEASING.md). Refusing to publish an unsigned build by accident."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building DockState $V (signed: $HAS_SIGNING)"

      - name: Run tests
        working-directory: Packages/DockStateKit
        run: swift test --parallel

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Write notary key
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          DEVELOPER_ID_APPLICATION: ${{ env.HAS_SIGNING == 'true' && secrets.DEVELOPER_ID_APPLICATION || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-release.sh "$VERSION"

      - name: Notarize app
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/notarize.sh app

      - name: Create DMG
        id: dmg
        env:
          DEVELOPER_ID_APPLICATION: ${{ env.HAS_SIGNING == 'true' && secrets.DEVELOPER_ID_APPLICATION || '' }}
          # GitHub expressions have no ternary: `cond && '' || x` always yields x.
          DMG_SUFFIX: ${{ env.HAS_SIGNING != 'true' && '-unsigned' || '' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/make-dmg.sh "$VERSION"

      - name: Notarize DMG
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: scripts/notarize.sh "$DMG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.dmg.outputs.dmg }}
          SPARKLE_ED_PRIVATE_KEY: ${{ env.HAS_SIGNING == 'true' && secrets.SPARKLE_ED_PRIVATE_KEY || '' }}
        run: |
          FLAGS=(--title "DockState $VERSION")
          if [[ "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"; FLAGS+=(--draft --target "$GITHUB_SHA")
          fi
          # The app's feed is the appcast of the "latest" release. Only a newer version may
          # become latest: a hotfix for an older line must not be offered as an update.
          newer() { # newer A B: version A is greater than B (x.y.z)
            local IFS=. i; local -a a=($1) b=($2)
            for i in 0 1 2; do
              if (( ${a[i]:-0} > ${b[i]:-0} )); then return 0; fi
              if (( ${a[i]:-0} < ${b[i]:-0} )); then return 1; fi
            done
            return 1
          }
          LATEST="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          LATEST="${LATEST#v}"
          BECOMES_LATEST=false
          if [[ "$VERSION" != *-* && "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ -z "$LATEST" ]] || newer "$VERSION" "$LATEST"; then BECOMES_LATEST=true; else FLAGS+=(--latest=false); fi
          fi
          # The new feed's build number must be higher than the one users have (Sparkle
          # orders updates by it). Only checked for the release that becomes the feed.
          if [[ "$BECOMES_LATEST" == "true" ]]; then
            MIN_BUILD="$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" 2>/dev/null \
              | sed -n 's:.*<sparkle\:version>\([0-9][0-9]*\)</sparkle\:version>.*:\1:p' | head -1 || true)"
            export MIN_BUILD
          fi
          # The notes GitHub would generate, fetched first so the appcast can show them.
          NOTES="$RUNNER_TEMP/notes.md"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body > "$NOTES"
          ASSETS=("$DMG" "$DMG.sha256")
          if [[ "$HAS_SIGNING" == "true" ]]; then
            # Signs the stapled DMG for Sparkle. Published together with the release, so the
            # latest release never lacks the appcast the app reads.
            scripts/make-appcast.sh "$VERSION" "$DMG" "$NOTES"
            ASSETS+=(dist/appcast.xml)
          else
            FLAGS+=(--prerelease)
            { printf '%s\n\n' "> [!WARNING]
          > This build is **not signed or notarized**, so macOS blocks it the first time.
          > Open DockState once, then go to **System Settings › Privacy & Security** and click **Open Anyway**.
          > (On macOS 14 you can also right-click DockState.app and choose **Open**.)
          > After updating an unsigned build, turn DockState's Accessibility permission off and on again."; cat "$NOTES"; } > "$NOTES.full"
            mv "$NOTES.full" "$NOTES"
          fi
          gh release create "$TAG" "${ASSETS[@]}" --notes-file "$NOTES" "${FLAGS[@]}"

      - name: Clean up signing material
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
