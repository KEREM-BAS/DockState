name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; every push to main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Core tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift test
        working-directory: Packages/DockStateKit
        run: swift test --parallel

  build:
    name: Build app (universal)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build Release (ad-hoc signed)
        run: scripts/build-release.sh
      - name: String catalog is in sync
        run: scripts/check-strings.sh
