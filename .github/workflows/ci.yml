name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Pull requests share a group per branch (superseded runs are cancelled); each push to
  # main gets its own group, so every commit on main is checked.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Core tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift test
        working-directory: Packages/DockStateKit
        run: swift test --parallel

  build:
    name: Build app (universal)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build Release (ad-hoc signed)
        run: scripts/build-release.sh
      - name: String catalog is in sync
        run: scripts/check-strings.sh
